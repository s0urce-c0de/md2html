<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD2HTML demo</title>
    <script src="./md2html.js" type="module" defer></script>
</head>
<body>
    <textarea name="" id="input"></textarea>
    <pre id="output"></pre>
    <script defer>
        document.getElementById("input").addEventListener("input", e => {
            const cont = document.createElement("div");

            cont.appendChild(md2html(e.target.value));

            document.getElementById("output").textContent = cont.innerHTML
        });
    </script>
</body>
</html>
